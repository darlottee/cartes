</head><body>
<title>Cartes de français</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter+Tight:wght@400;500;600;800&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Карточки книги «France · A1—A2»: белая бумага, чёрные чернила, огромные брусковые буквы глав. Один светлый мир, как в книге. */
:root{
  --paper:#ffffff; --ink:#1d1a18; --ink2:#55504c; --mute:#9a9692; --line:#e2e2e2; --soft:#f4f4f4;
  --good:#1d1a18; --bad:#b3261e;
  --display:'Alfa Slab One','Rockwell Extra Bold',Georgia,serif;
  --sans:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --serif:'Tinos','Times New Roman',Times,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.brand{font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:13px}
.brand small{font-weight:500;color:var(--mute);margin-left:8px;letter-spacing:.08em}
.back{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.sync{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}

/* главная */
.hero{padding:26px 0 8px}
.hero svg{display:block;width:100%;height:clamp(120px,24vw,230px)}
.hero text{font-family:var(--display);fill:var(--ink)}
.lead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:baseline;padding:10px 0 22px;border-bottom:2px solid var(--ink)}
.lead h1{margin:0;font-weight:800;font-size:clamp(22px,4vw,32px);letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance}
.lead p{margin:0;color:var(--ink2);max-width:46ch}
.total{font-variant-numeric:tabular-nums;font-weight:800}
.decks{list-style:none;margin:0;padding:0}
.deck{display:grid;grid-template-columns:64px 1fr auto;gap:4px 16px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.deck:hover .dt{text-decoration:underline;text-underline-offset:4px}
.dn{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.dt{font-weight:800;font-size:17px;letter-spacing:-.01em;min-width:0}
.dt small{display:block;font-weight:400;font-family:var(--serif);font-size:15px;color:var(--ink2);letter-spacing:0}
.dp{grid-column:2 / 4;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;background:var(--line);position:relative;max-width:360px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.dc{font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* колода */
.dhead{padding:20px 0 4px}
.dhead svg{display:block;width:100%;height:clamp(90px,17vw,170px)}
.dhead text{font-family:var(--display);fill:var(--ink)}
.dmeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 18px;padding:8px 0 14px;border-bottom:2px solid var(--ink)}
.dmeta h2{margin:0;font-weight:800;font-size:clamp(20px,3.6vw,28px);letter-spacing:-.03em;text-transform:uppercase}
.dmeta p{margin:0;font-family:var(--serif);font-size:17px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stat{padding:12px 0}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.modes{display:flex;flex-wrap:wrap;gap:10px;padding:18px 0}
.btn{padding:13px 20px;border:2px solid var(--ink);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn:active{transform:translateY(1px)}
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{padding:11px 14px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{list-style:none;margin:8px 0 0;padding:0;columns:2 280px;column-gap:28px}
.list li{break-inside:avoid;display:grid;grid-template-columns:12px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list .dot{width:8px;height:8px;margin-top:7px;border:1.5px solid var(--ink)}
.list .dot.b1,.list .dot.b2{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.list .dot.b3,.list .dot.b4,.list .dot.b5{background:var(--ink)}
.list .lf{font-family:var(--serif);font-size:16px}
.list .lr{font-size:13px;color:var(--ink2)}

/* сессия */
.sess{padding:18px 0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.sbar{height:3px;background:var(--line);margin:10px 0 18px;position:relative}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .25s}
.card{position:relative;width:100%;min-height:min(56vh,440px);border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 22px;cursor:pointer;user-select:none}
.card .side{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.big{font-family:var(--serif);font-size:clamp(30px,6.4vw,54px);line-height:1.08;overflow-wrap:anywhere}
.tr{font-size:15px;color:var(--ink2);letter-spacing:.02em}
.ru{font-weight:800;font-size:clamp(22px,4.2vw,34px);letter-spacing:-.02em;line-height:1.15}
.ex{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);max-width:52ch}
.ex .exf{font-family:var(--serif);font-size:18px}
.ex .exr{font-size:13px;color:var(--ink2);margin-top:3px}
.hint{position:absolute;bottom:12px;left:0;right:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.say{position:absolute;top:12px;right:12px;width:44px;height:44px;border:1.5px solid var(--ink);display:grid;place-items:center}
.say svg{width:20px;height:20px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.answer .btn{width:100%;padding:16px}
.answer .no{border-color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:2px solid var(--ink);padding:16px 14px;text-align:left;font-size:16px;min-height:64px}
.opt.fr{font-family:var(--serif);font-size:19px}
.opt.right{background:var(--ink);color:var(--paper)}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.done{text-align:center;padding:40px 0}
.done svg{display:block;width:100%;height:clamp(110px,22vw,200px)}
.done text{font-family:var(--display);fill:var(--ink)}
.done p{font-size:17px;color:var(--ink2)}
.done .modes{justify-content:center}
.note{font-size:12px;color:var(--mute);padding:14px 0}
@media (max-width:520px){.opts{grid-template-columns:1fr}.deck{grid-template-columns:48px 1fr auto}.dn{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

кЁ","быть в восторге, что","Je suis ravie que tu viennes.","Я в восторге, что ты придёшь."],["regretter que","рёгрэтЕ кЁ","сожалеть, что","Je regrette que tu partes.","Жаль, что ты уезжаешь."],["souhaiter que","суэтЕ кЁ","желать, чтобы","Je souhaite que tu sois heureux.","Желаю, чтобы ты был счастлив."],["douter que","дутЕ кЁ","сомневаться, что","Je doute qu'il vienne.","Сомневаюсь, что он придёт."],["un critique d'art","эн критИк дАр","искусствовед","C'est un critique d'art célèbre.","Это известный искусствовед."],["inventer","энвантЕ","придумать","Il invente une histoire.","Он придумывает историю."],["passionné(e)","пасьёнЕ","страстный","Elle est passionnée de musique.","Она страстно увлечена музыкой."],["le long de","лё лОн дё","вдоль","On se promène le long de la Seine.","Мы гуляем вдоль Сены."],["couler","кулЕ","течь","La Seine coule sous les ponts.","Сена течёт под мостами."],["la ponctuation","ла понктюасйОн","пунктуация","Attention à la ponctuation !","Внимание к пунктуации!"],["le vers","лё вЭр","стих, строка","J'apprends quelques vers par cœur.","Я учу несколько строк наизусть."],["peu importe","пё энпОрт","неважно","Peu importe, on y va !","Неважно, пошли!"],["demeurer","дёмёрЕ","оставаться","Les jours s'en vont, je demeure.","Дни уходят, я остаюсь."],["la peine","ла пЭн","горе, мука","Il a de la peine.","Ему горько."],["l'onde (f)","лОнд","волна (поэт.)","L'onde est calme ce soir.","Вечером волна спокойна."],["las, lasse","лА лАс","усталый","Je suis las de tout.","Я от всего устал."],["le plaisir","лё плэзИр","удовольствие","Avec plaisir !","С удовольствием!"],["l'amitié (f)","ламитьЕ","дружба","Notre amitié est très importante.","Наша дружба очень важна."],["la honte","ла Онт","стыд","Il rougit de honte.","Он краснеет от стыда."],["l'espoir (m)","лэспуАр","надежда","Il y a encore de l'espoir.","Ещё есть надежда."],["le rêve","лё рЭв","мечта; сон","Mon rêve est de vivre à Paris.","Моя мечта — жить в Париже."],["le souvenir","лё сувнИр","воспоминание","J'achète un souvenir pour ma mère.","Я покупаю сувенир для мамы."],["l'avis (m)","лавИ","мнение","Quel est ton avis ?","Какое твоё мнение?"],["l'opinion (f)","лопинйОн","мнение","Chacun a son opinion.","У каждого своё мнение."],["l'idée (f)","лидЕ","идея","C'est une bonne idée !","Это хорошая идея!"],["le doute","лё дУт","сомнение","Sans aucun doute !","Без сомнения!"],["penser","пансЕ","думать","Je pense à toi.","Я думаю о тебе."],["croire","круАр","верить, считать","Je te crois.","Я тебе верю."],["trouver","трувЕ","находить, считать","Je ne trouve pas mes lunettes.","Я не могу найти свои очки."],["espérer","эсперЕ","надеяться","J'espère que tu vas bien.","Надеюсь, у тебя всё хорошо."],["souhaiter","суэтЕ","желать","Je te souhaite bonne chance !","Желаю тебе удачи!"],["rêver","рэвЕ","мечтать","Je rêve de la mer.","Я мечтаю о море."],["aimer","эмЕ","любить","Je t'aime.","Я тебя люблю."],["détester","детэстЕ","ненавидеть","Je déteste attendre.","Терпеть не могу ждать."],["préférer","преферЕ","предпочитать","Je préfère le thé au café.","Я предпочитаю чай кофе."],["avoir peur","авуАр пЁр","бояться","N'aie pas peur !","Не бойся!"],["pleurer","плёрЕ","плакать","Le bébé pleure.","Малыш плачет."],["rire","рИр","смеяться","On rit beaucoup ensemble.","Мы много смеёмся вместе."],["s'inquiéter","сэнкьетЕ","беспокоиться","Ne t'inquiète pas !","Не волнуйся!"],["s'ennuyer","саннюиЕ","скучать","Je m'ennuie à la maison.","Мне скучно дома."],["regretter","рёгрэтЕ","сожалеть","Je ne regrette rien.","Я ни о чём не жалею."],["douter","дутЕ","сомневаться","Je doute de sa réponse.","Я сомневаюсь в его ответе."],["être d'accord","Этр дакОр","соглашаться","Nous sommes d'accord.","Мы согласны."],["heureux, heureuse","ёрЁ ёрЁз","счастливый","Ils sont heureux ensemble.","Они счастливы вместе."],["joyeux, joyeuse","жуаЁ жуаЁз","радостный","C'est une fête joyeuse.","Это радостный праздник."],["ravi(e)","равИ","в восторге","Je suis ravi de vous rencontrer.","Очень рад с вами познакомиться."],["amoureux, amoureuse","амурЁ амурЁз","влюблённый","Ils sont très amoureux.","Они очень влюблены."],["fier, fière","фьЕр фьЕр","гордый","Je suis fière de toi.","Я горжусь тобой."],["calme","кАльм","спокойный","Il est toujours calme.","Он всегда спокоен."],["reconnaissant(e)","рёконэсАн","благодарный","Je vous suis très reconnaissant.","Я вам очень благодарен."],["malheureux, malheureuse","малёрЁ малёрЁз","несчастный","Il est malheureux sans elle.","Он несчастен без неё."],["fâché(e)","фашЕ","рассерженный","Elle est fâchée contre moi.","Она на меня сердится."],["en colère","ан колЭр","в гневе","Mon père est en colère.","Папа в гневе."],["inquiet, inquiète","энкьЕ энкьЕт","обеспокоенный","Je suis inquiète pour toi.","Я волнуюсь за тебя."],["jaloux, jalouse","жалУ жалУз","ревнивый","Il est jaloux de son frère.","Он завидует брату."],["nerveux, nerveuse","нэрвЁ нэрвЁз","нервный","Il est nerveux avant le match.","Он нервничает перед матчем."],["stressé(e)","стрэсЕ","в стрессе","Je suis stressé avant l'entretien.","Я нервничаю перед собеседованием."],["gêné(e)","жэнЕ","смущённый","Il est gêné et ne dit rien.","Он смущён и молчит."]]}]</script>
<script>
const DECKS = JSON.parse(document.getElementById('data').textContent);
const WORDS = {"00": "SONS", "01": "BONJOUR", "02": "MOI", "03": "POURQUOI", "04": "VILLE", "05": "J'AIME", "06": "BLEU", "07": "FAMILLE", "08": "MENU", "09": "PRIX", "10": "LIBRE", "11": "CORPS", "12": "MÉTIER", "13": "MATIN", "14": "HIER", "15": "PARTIR", "16": "ENFANCE", "17": "ICI", "18": "RÉCIT", "19": "DEMAIN", "20": "PLUS", "21": "ÉCOLE", "22": "EMPLOI", "23": "DÉSIR", "24": "DELF"};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── прогресс: ящики Лейтнера 0–5; «знаю» = 3+ ── */
let P = {};           // P[n] = {index: box}
try { P = JSON.parse(localStorage.getItem('cartes-progress') || '{}') || {}; } catch (e) { P = {}; }
let DB = null, UID = null, syncState = 'local';
const pending = new Set(); let saveTimer = null;
function box(n, i){ return (P[n] && P[n][i]) || 0; }
function setBox(n, i, b){
  P[n] = P[n] || {}; P[n][i] = Math.max(0, Math.min(5, b));
  try { localStorage.setItem('cartes-progress', JSON.stringify(P)); } catch (e) {}
  pending.add(n); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500);
}
async function flush(){
  if (!DB || !UID) return;
  const ns = [...pending]; pending.clear();
  for (const n of ns) { try { await DB.doc('data/users/' + UID + '/decks/u' + n).set({ b: P[n] || {} }); } catch (e) {} }
}
function stats(n){
  const d = DECKS.find(x => x.n === n); let known = 0, learn = 0;
  d.cards.forEach((c, i) => { const b = box(n, i); if (b >= 3) known++; else if (b > 0) learn++; });
  return { total: d.cards.length, known, learn, fresh: d.cards.length - known - learn };
}

/* ── огромное слово, растянутое на всю ширину ── */
function giant(word, h = 420){
  const acc = /[ÉÈÊÀÂÎÔÛÇ]/.test(word);
  return `<svg viewBox="0 ${acc ? -70 : 0} 1000 ${acc ? h + 70 : h}" preserveAspectRatio="none" aria-hidden="true"><text x="0" y="372" textLength="1000" lengthAdjust="spacingAndGlyphs" font-size="470">${esc(word)}</text></svg>`;
}

/* ── озвучка французским голосом устройства ── */
let FRV = null;
function pickVoice(){ try { const v = speechSynthesis.getVoices(); FRV = v.find(x => /^fr(-|_)FR/i.test(x.lang)) || v.find(x => /^fr/i.test(x.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(t){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g, '').replace(/\//g, ',')); u.lang = 'fr-FR'; if (FRV) u.voice = FRV; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
}
const canSpeak = 'speechSynthesis' in window;
const SAY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>`;

/* ── экраны ── */
let dir = 'fr';   // fr: французский → русский; ru: русский → французский
try { dir = localStorage.getItem('cartes-dir') || 'fr'; } catch (e) {}

function home(){
  const all = DECKS.reduce((a, d) => { const s = stats(d.n); a.t += s.total; a.k += s.known; return a; }, { t: 0, k: 0 });
  app.innerHTML = `
  <header class="top"><span class="brand">France · A1—A2<small>Cartes</small></span><span class="sync">${syncState === 'cloud' ? 'прогресс в аккаунте' : 'прогресс на устройстве'}</span></header>
  <div class="hero">${giant('CARTES')}</div>
  <div class="lead"><h1>Слова книги по главам</h1>
    <p>Выучено <span class="total">${all.k}</span> из <span class="total">${all.t}</span>. Карточка «выучена», когда вы трижды подряд её узнали.</p></div>
  <ul class="decks">${DECKS.map(d => { const s = stats(d.n); const pct = s.total ? Math.round(s.known / s.total * 100) : 0;
    return `<li><button class="deck" data-n="${d.n}"><span class="dn">${d.n}</span><span class="dt">${esc(d.title)}<small>${esc(d.ru)}</small></span>
      <span class="dc">${s.known}/${s.total}</span><span class="dp"><span class="bar"><i style="width:${pct}%"></i></span>${pct}%</span></button></li>`; }).join('')}</ul>`;
  app.querySelectorAll('.deck').forEach(b => b.onclick = () => go('u' + b.dataset.n));
}

function deck(n){
  const d = DECKS.find(x => x.n === n); if (!d) return home();
  const s = stats(n);
  app.innerHTML = `
  <header class="top"><button class="back" id="bk">← Все главы</button><span class="sync">Unité ${n}</span></header>
  <div class="dhead">${giant(WORDS[n] || d.title.split(' ')[0].toUpperCase())}</div>
  <div class="dmeta"><h2>${esc(d.title)}</h2><p>${esc(d.ru)}</p></div>
  <div class="stats"><div class="stat"><b>${s.known}</b><span>выучено</span></div><div class="stat"><b>${s.learn}</b><span>учу</span></div><div class="stat"><b>${s.fresh}</b><span>новые</span></div></div>
  <div class="modes">
    <button class="btn fill" id="m-cards">Карточки</button>
    <button class="btn" id="m-test">Тест</button>
    <span class="seg" role="group" aria-label="Направление">
      <button aria-pressed="${dir === 'fr'}" data-d="fr">FR → RU</button><button aria-pressed="${dir === 'ru'}" data-d="ru">RU → FR</button></span>
  </div>
  <ul class="list">${d.cards.map((c, i) => `<li><span class="dot b${box(n, i)}"></span><span><span class="lf">${esc(c[0])}</span><br><span class="lr">${esc(c[2])}</span></span></li>`).join('')}</ul>
  <p class="note">Квадрат: пустой — новое слово, наполовину — учу, закрашен — выучено.</p>`;
  app.querySelector('#bk').onclick = () => go('');
  app.querySelector('#m-cards').onclick = () => session(n, 'cards');
  app.querySelector('#m-test').onclick = () => session(n, 'test');
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { dir = b.dataset.d; try { localStorage.setItem('cartes-dir', dir); } catch (e) {} deck(n); });
}

function pickQueue(n, size = 20){
  const d = DECKS.find(x => x.n === n);
  const idx = d.cards.map((c, i) => i).sort(() => Math.random() - .5).sort((a, b) => box(n, a) - box(n, b));
  return idx.slice(0, Math.min(size, idx.length));
}

function session(n, mode){
  const d = DECKS.find(x => x.n === n);
  let queue = pickQueue(n), pos = 0, right = 0, total = queue.length, flipped = false, locked = false;
  function shell(inner){
    app.innerHTML = `<header class="top"><button class="back" id="bk">← ${esc(d.title)}</button><span class="sync">${mode === 'test' ? 'Тест' : 'Карточки'} · ${dir === 'fr' ? 'FR → RU' : 'RU → FR'}</span></header>
    <div class="sess"><div class="shead"><span>${Math.min(pos + 1, total)} / ${total}</span><span>верно ${right}</span></div><div class="sbar"><i style="width:${pos / total * 100}%"></i></div>${inner}</div>`;
    app.querySelector('#bk').onclick = () => deck(n);
  }
  function front(c){ return dir === 'fr'
    ? `<span class="big">${esc(c[0])}</span>${c[1] ? `<span class="tr">[${esc(c[1])}]</span>` : ''}`
    : `<span class="ru">${esc(c[2])}</span>`; }
  function back(c){ return `<span class="big">${esc(c[0])}</span>${c[1] ? `<span class="tr">[${esc(c[1])}]</span>` : ''}<span class="ru">${esc(c[2])}</span>
    ${c[3] ? `<div class="ex"><div class="exf">${esc(c[3])}</div><div class="exr">${esc(c[4])}</div></div>` : ''}`; }
  function next(){
    pos++; flipped = false; locked = false;
    if (pos >= queue.length) return finish();
    render();
  }
  function mark(i, ok){ const b = box(n, i); setBox(n, i, ok ? b + 1 : 1); if (ok) right++; else if (queue.length < total * 2) queue.push(i); }
  function render(){
    const i = queue[pos], c = d.cards[i];
    if (mode === 'cards'){
      shell(`<div class="card" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="side">${flipped ? back(c) : front(c)}</div>
        ${canSpeak ? `<button class="say" id="say" aria-label="Произнести">${SAY}</button>` : ''}<span class="hint">${flipped ? '' : 'нажмите, чтобы перевернуть'}</span></div>
        ${flipped ? `<div class="answer"><button class="btn no" id="no">Не знаю</button><button class="btn fill" id="yes">Знаю</button></div>` : ''}`);
      const card = app.querySelector('#card');
      card.onclick = e => { if (e.target.closest('#say')) return; if (!flipped){ flipped = true; render(); if (dir === 'ru') speak(c[0]); } };
      card.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); card.click(); } };
      const say = app.querySelector('#say'); if (say) say.onclick = () => speak(c[0]);
      if (flipped){ app.querySelector('#no').onclick = () => { mark(i, false); next(); }; app.querySelector('#yes').onclick = () => { mark(i, true); next(); }; }
    } else {
      const others = d.cards.map((x, k) => k).filter(k => k !== i && d.cards[k][2] !== c[2]).sort(() => Math.random() - .5).slice(0, 3);
      const opts = [i, ...others].sort(() => Math.random() - .5);
      const label = k => dir === 'fr' ? esc(d.cards[k][2]) : esc(d.cards[k][0]);
      shell(`<div class="card" style="cursor:default"><div class="side">${front(c)}</div>${canSpeak && dir === 'fr' ? `<button class="say" id="say" aria-label="Произнести">${SAY}</button>` : ''}</div>
        <div class="opts">${opts.map(k => `<button class="opt ${dir === 'ru' ? 'fr' : ''}" data-k="${k}">${label(k)}</button>`).join('')}</div>`);
      const say = app.querySelector('#say'); if (say) say.onclick = () => speak(c[0]);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (locked) return; locked = true;
        const k = +b.dataset.k, ok = k === i;
        b.classList.add(ok ? 'right' : 'wrong');
        if (!ok) app.querySelector(`.opt[data-k="${i}"]`).classList.add('right');
        mark(i, ok); if (canSpeak) speak(c[0]);
        setTimeout(next, ok ? 700 : 1500);
      });
    }
  }
  function finish(){
    app.innerHTML = `<header class="top"><button class="back" id="bk">← ${esc(d.title)}</button><span class="sync">Готово</span></header>
    <div class="done">${giant(right >= total * .8 ? 'BRAVO' : 'ENCORE')}<p>Верно ${right} из ${total}. ${right >= total * .8 ? 'Отлично!' : 'Ещё один круг — и слова встанут на место.'}</p>
    <div class="modes"><button class="btn fill" id="again">Ещё раз</button><button class="btn" id="tod">К главе</button></div></div>`;
    app.querySelector('#bk').onclick = () => deck(n);
    app.querySelector('#tod').onclick = () => deck(n);
    app.querySelector('#again').onclick = () => session(n, mode);
    flush();
  }
  render();
}

/* ── навигация по #u07 ── */
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
function route(){ const h = location.hash.slice(1); const m = /^u(\d\d)$/.exec(h); if (m) deck(m[1]); else home(); window.scrollTo(0, 0); }
addEventListener('hashchange', route);
route();

/* ── синхронизация прогресса через аккаунт (если доступно) ── */
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; UID = id;
    const snap = await db.collection('data/users/' + id + '/decks').get();
    (snap.docs || []).forEach(doc => { const n = doc.id.replace(/^u/, ''); const b = (doc.data() || {}).b || {};
      P[n] = P[n] || {}; for (const k in b) P[n][k] = Math.max(P[n][k] || 0, b[k]); });
    try { localStorage.setItem('cartes-progress', JSON.stringify(P)); } catch (e) {}
    syncState = 'cloud';
    Object.keys(P).forEach(n => pending.add(n)); flush();
    route();
  } catch (e) {}
})();
</script>
